name: CampusBite CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: campusbite-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: campusbite-menu
            context: ./menu-service
          - image: campusbite-order
            context: ./order-service
          - image: campusbite-notify
            context: ./notify-service
          - image: campusbite-auth
            context: ./auth-service
          - image: campusbite-frontend
            context: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: publish
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize cluster secrets
        shell: pwsh
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          if (-not $env:JWT_SECRET -or -not $env:MONGO_ROOT_PASSWORD) {
            throw "Set GitHub Actions secrets JWT_SECRET and MONGO_ROOT_PASSWORD."
          }
          $user = if ($env:MONGO_ROOT_USERNAME) { $env:MONGO_ROOT_USERNAME } else { "campusbite" }
          @(
            "jwt-secret=$($env:JWT_SECRET)"
            "mongo-root-username=$user"
            "mongo-root-password=$($env:MONGO_ROOT_PASSWORD)"
          ) | Set-Content -Path k8s/secrets.env -Encoding ascii

      - name: Apply manifests
        shell: pwsh
        run: kubectl apply -k k8s

      - name: Wait for rollouts
        shell: pwsh
        run: |
          kubectl -n campusbite rollout status statefulset/mongo --timeout=180s
          foreach ($name in @("menu-service","order-service","notify-service","auth-service","frontend")) {
            kubectl -n campusbite rollout status "deployment/$name" --timeout=180s
          }
          kubectl -n campusbite get all,ingress,pvc
