apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/part-of: campusbite
    app.kubernetes.io/component: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campusbite
        app.kubernetes.io/component: orders
    spec:
      containers:
        - name: orders
          image: campusbite-order
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: campusbite-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campusbite-secrets
                  key: jwt-secret
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: campusbite-secrets
                  key: mongo-root-username
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campusbite-secrets
                  key: mongo-root-password
            - name: MONGO_URI
              value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongo-0.mongo:27017/campusbite_orders?authSource=admin
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
