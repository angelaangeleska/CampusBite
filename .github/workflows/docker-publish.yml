name: CampusBite CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: campusbite-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose file
        run: docker compose config --quiet

      - name: Render Kubernetes manifests
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s >/tmp/campusbite-manifests.yaml
          kubectl kustomize k8s | grep -q "kind: Namespace"
          kubectl kustomize k8s | grep -q "kind: StatefulSet"
          kubectl kustomize k8s | grep -q "kind: Ingress"

  test-backend:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, menu-service, order-service, notify-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q --tb=short

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  publish:
    name: Push ${{ matrix.image }}
    needs: [validate, test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: campusbite-menu
            context: ./menu-service
          - image: campusbite-order
            context: ./order-service
          - image: campusbite-notify
            context: ./notify-service
          - image: campusbite-auth
            context: ./auth-service
          - image: campusbite-frontend
            context: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Kubernetes
    needs: [validate, test-backend, test-frontend, publish]
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize cluster secrets
        shell: powershell
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) { throw "Missing secret JWT_SECRET" }
          if ([string]::IsNullOrWhiteSpace($env:MONGO_ROOT_PASSWORD)) { throw "Missing secret MONGO_ROOT_PASSWORD" }
          $user = $env:MONGO_ROOT_USERNAME
          if ([string]::IsNullOrWhiteSpace($user)) { $user = "campusbite" }
          Set-Content -Path k8s/secrets.env -Encoding ascii -Value (
            "jwt-secret=$env:JWT_SECRET",
            "mongo-root-username=$user",
            "mongo-root-password=$env:MONGO_ROOT_PASSWORD"
          )

      - name: Pin Deployments to this commit's image tag
        shell: powershell
        run: |
          $tag = "git-" + "${{ github.sha }}".Substring(0, 7)
          Write-Host "Deploying image tag $tag"
          $path = Join-Path $PWD "k8s\kustomization.yaml"
          $content = [System.IO.File]::ReadAllText($path)
          $updated = $content -replace "newTag: latest", "newTag: $tag"
          if ($updated -eq $content) { throw "Failed to pin image tags in kustomization.yaml" }
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($path, $updated, $utf8)

      - name: Apply manifests
        shell: powershell
        run: kubectl apply -k k8s

      - name: Wait for rollouts
        shell: powershell
        run: |
          kubectl -n campusbite rollout status statefulset/mongo --timeout=180s
          foreach ($name in @("menu-service","order-service","notify-service","auth-service","frontend")) {
            kubectl -n campusbite rollout status "deployment/$name" --timeout=180s
          }
          kubectl -n campusbite get all,ingress,pvc
