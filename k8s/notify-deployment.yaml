apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-service
  labels:
    app.kubernetes.io/part-of: campusbite
    app.kubernetes.io/component: notify
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: notify
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: campusbite
        app.kubernetes.io/component: notify
    spec:
      containers:
        - name: notify
          image: campusbite-notify
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: campusbite-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campusbite-secrets
                  key: jwt-secret
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: campusbite-config
                  key: NOTIFY_MONGO_URI
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
